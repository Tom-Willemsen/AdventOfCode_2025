[package]
name = "aoc2025_wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0", default-features=false }
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = "1.3"
rayon = "1.11"
ndarray = { version = "*", features = ["rayon"] }
modinverse = { version = "*" }
mod_exp = { version = "*" }
bitvec = { version = "1" }
itertools = { version = "*" }
num = { version = "*" }
ahash = { version = "*" }
getrandom = { version = "0.3", features = ["wasm_js"] }

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
panic = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
